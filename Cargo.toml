[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/agent"]

[workspace.package]
edition = "2024"
authors = ["GoRules <hi@gorules.io>"]

[workspace.dependencies]
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zen-engine = { version = "2.1.2", features = ["arbitrary_precision"] }
zen-expression = { version = "2.1.2", features = ["arbitrary_precision"] }

[profile.dev.build-override]
opt-level = 2

[profile.release.build-override]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
